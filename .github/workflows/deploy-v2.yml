name: Deploy v2 (staging-omgeving)

on:
  push:
    branches: [v2]
  workflow_dispatch:

# Minimale rechten: de workflow hoeft alleen de repo te lezen.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions vastgepind op commit-SHA; Dependabot houdt ze bij.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src
          skip_app_build: true
          # Aparte omgeving naast productie: de huidige site op main blijft ongemoeid.
          deployment_environment: v2
